version: '3.8'

services:
  
  db_trabajo_final: 
    image: postgres:15-alpine
    container_name: jh7_postgres_final 
    restart: always
    environment:
      POSTGRES_USER: admin_jh7
      POSTGRES_PASSWORD: telecom_2026
      POSTGRES_DB: jh7_db
    ports:
      - "5433:5432" 
    volumes:
      - postgres_data_trabajo_final:/var/lib/postgresql/data

  
  backend:
    build: ./backend
    container_name: jh7_api
    restart: always
    ports:
      - "3001:3000"
    environment:
      
      DATABASE_URL: "postgresql://admin_jh7:telecom_2026@db_trabajo_final:5432/jh7_db?schema=public"
      UPLOAD_PATH: "/app/uploads"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - db_trabajo_final

  
  frontend:
    build: ./frontend
    container_name: jh7_web
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3001
    depends_on:
      - backend

volumes:
  
  postgres_data_trabajo_final: